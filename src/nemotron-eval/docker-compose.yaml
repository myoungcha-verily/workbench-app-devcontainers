services:
  app:
    # Workbench proxies to the container named "application-server" on
    # "app-network", and on GPU VMs injects the NVIDIA runtime block into this
    # service. Do not add a `deploy:` section here.
    container_name: "application-server"
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: always
    shm_size: "8gb"
    environment:
      # nvidia-smi is only injected into the container with the "utility" capability.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: "/data/ollama"
      # 64K leaves room for workspace context, tool schemas and results; the
      # 30B is validated at this size on an A100 40GB (opencode-nemotron-mcp).
      OLLAMA_CONTEXT_LENGTH: "65536"
      OLLAMA_FLASH_ATTENTION: "true"
      # Keep the loaded model in VRAM until another model replaces it: loading
      # the 30B takes over a minute, and this VM serves only this app.
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Persist compiled CUDA kernels so warm-up is faster after a restart.
      CUDA_CACHE_PATH: "/data/cuda-cache"
      CUDA_CACHE_MAXSIZE: "4294967296"
      DATA_DIR: "/data"
      # Where llm-context writes ~/.claude/CLAUDE.md and skills for this user.
      APP_USER_HOME: "/home/nemotron"
      # GGUFs that have no Ollama registry tag are downloaded from here.
      MODELS_BUCKET: "cloned-models-wb-meteoric-gourd-5139"
      # Optional: set to a workspace bucket name to back up finished eval runs.
      RESULTS_BUCKET: ""
    volumes:
      - .:/workspace:cached
      # The user's home (wb login, generated context) and the app data (Ollama
      # weights, DuckDB) live on the VM data disk and survive restarts.
      - work:/home/nemotron
      - data:/data
    ports:
      - "8080:8080"
    networks:
      - app-network
    # SYS_ADMIN and fuse are required to mount workspace buckets into the container.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

volumes:
  work:
  data:

networks:
  app-network:
    external: true
