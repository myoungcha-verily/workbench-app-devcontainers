services:
  app:
    # Workbench proxies to the container named "application-server" on
    # "app-network", and on GPU VMs injects the NVIDIA runtime block into this
    # service. Do not add a `deploy:` section here.
    container_name: "application-server"
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: always
    shm_size: "8gb"
    environment:
      # nvidia-smi is only injected into the container with the "utility" capability.
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_MODELS: "/data/ollama"
      # 64K leaves room for workspace context, tool schemas and results; the
      # 30B is validated at this size on an A100 40GB (opencode-nemotron-mcp).
      OLLAMA_CONTEXT_LENGTH: "65536"
      OLLAMA_FLASH_ATTENTION: "true"
      # Keep the loaded model in VRAM until another model replaces it: loading
      # the 30B takes over a minute, and this VM serves only this app.
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Persist compiled CUDA kernels so warm-up is faster after a restart.
      CUDA_CACHE_PATH: "/data/cuda-cache"
      CUDA_CACHE_MAXSIZE: "4294967296"
      # ---- Workspace-specific settings: change these when deploying elsewhere ----
      # Bucket holding the Nemotron GGUF files (models/...gguf); needed for 9B and Bolt.
      MODELS_BUCKET: "cloned-models-wb-meteoric-gourd-5139"
      # Optional: bucket name to back up finished eval runs.
      RESULTS_BUCKET: ""
      # BigQuery datasets governed chats may query through the SQL broker (comma-separated,
      # "dataset" or "project.dataset"). Nothing else is reachable from a governed sandbox.
      GOVERNED_DATASETS: "redteam_bhs"
      # Buckets governed sandboxes may read, with a downscoped read-only token (blank = none).
      GOVERNED_BUCKETS: "cloned-synthetic-allofus-demo-wb-meteoric-gourd-5139"
      # The audit trail is copied here every 5 minutes (blank = keep it on the data disk only).
      AUDIT_EXPORT_URI: "gs://eval-benchmark-wb-meteoric-gourd-5139/openshell-pilot/audit"
      # ---- End of workspace-specific settings ----
      DATA_DIR: "/data"
      # Where llm-context writes ~/.claude/CLAUDE.md and skills for this user.
      APP_USER_HOME: "/home/nemotron"
      # Governed chats (OpenShell pilot).
      OPENSHELL_GATEWAY_ENDPOINT: "http://openshell-gateway:8080"
      OPENSHELL_TELEMETRY_ENABLED: "false"
      APP_NAME: "nemotron-openshell-pilot"
    volumes:
      - .:/workspace:cached
      # The user's home (wb login, generated context) and the app data (Ollama
      # weights, DuckDB) live on the VM data disk and survive restarts.
      - work:/home/nemotron
      - data:/data
    ports:
      # Workbench's start-proxy-agent.sh proxies the port published on 0.0.0.0, so it
      # must stay published on all interfaces (a 127.0.0.1 binding leaves the app
      # unreachable). port-guard below drops connections to it from other VMs.
      - "8080:8080"
    networks:
      - app-network
    # SYS_ADMIN and fuse are required to mount workspace buckets into the container.
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined

  # ---- OpenShell (governed chats). Pattern from OpenShell's deploy/docker.
  openshell-init:
    image: &openshell-gateway ghcr.io/nvidia/openshell/gateway:0.1.4@sha256:bdb4fe248070032c88be78f029dad9325cb698480e90486e1413a674a5d8edc8
    user: "0"
    restart: "no"
    command: ["generate-certs", "--output-dir", "/var/lib/openshell/tls"]
    environment:
      HOME: /var/lib/openshell
      OPENSHELL_TELEMETRY_ENABLED: "false"
    volumes:
      - &openshell-data
        type: bind
        source: /var/lib/openshell
        target: /var/lib/openshell
        bind:
          create_host_path: true
    network_mode: none

  openshell-gateway:
    container_name: "openshell-gateway"
    image: *openshell-gateway
    restart: always
    depends_on:
      openshell-init:
        condition: service_completed_successfully
      sandbox-image:
        condition: service_completed_successfully
    command: []
    # Creates sandbox containers through the host Docker daemon. Root on the
    # VM in effect: acceptable for the pilot, a platform gap for production.
    user: "0"
    ports:
      # Supervisors run on the host network and call back here. Loopback only.
      - "127.0.0.1:8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - *openshell-data
      - type: bind
        source: ./openshell/gateway.toml
        target: /etc/openshell/gateway.toml
        read_only: true
    environment:
      OPENSHELL_GATEWAY_CONFIG: /etc/openshell/gateway.toml
      OPENSHELL_DB_URL: "sqlite:/var/lib/openshell/gateway.db?mode=rwc"
      OPENSHELL_TELEMETRY_ENABLED: "false"
      XDG_DATA_HOME: /var/lib/openshell
      HOME: /var/lib/openshell
    networks:
      - app-network

  # Drops connections to the app port that arrive on the VM's network card, so other
  # VMs in the network cannot reach it without Workbench sign-in. The Workbench proxy
  # agent dials out, and sandboxes and the proxy reach the app locally, so neither is
  # affected. The rule sits in the raw table, before Docker's NAT, and stays in place
  # after this container exits.
  port-guard:
    image: alpine:3.20
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: on-failure
    command:
      - sh
      - -euc
      - |
        apk add --no-cache iptables >/dev/null
        nic=$$(ip route show default | awk '{print $$5; exit}')
        [ -n "$$nic" ] || { echo "port-guard: no default interface" >&2; exit 1; }
        rule="-i $$nic -p tcp --dport 8080 -j DROP"
        iptables -t raw -C PREROUTING $$rule 2>/dev/null || iptables -t raw -I PREROUTING $$rule
        # IPv6 is usually off on Workbench VMs; best effort.
        ip6tables -t raw -C PREROUTING $$rule 2>/dev/null || ip6tables -t raw -I PREROUTING $$rule 2>/dev/null || true
        echo "port-guard: dropping tcp/8080 arriving on $$nic"

  # Builds the sandbox workload image, then exits.
  sandbox-image:
    image: nemotron-agent-sandbox:0.2
    build:
      context: .
      dockerfile: sandbox-image/Dockerfile
    command: ["true"]
    restart: "no"
    network_mode: none

volumes:
  work:
  data:

networks:
  app-network:
    external: true
